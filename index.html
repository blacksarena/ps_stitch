<!DOCTYPE html>
<html lang="ja">
<html>

<head>
  <meta charset="utf-8">
  <title>OpenCV.js Stitcher_SCANS風</title>
  <script src="https://docs.opencv.org/4.10.0/opencv.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="tabs">
    <ul class="tab-list">
      <li class="tab-item active" tabindex="0">Stitch</li>
      <li class="tab-item" tabindex="0">Parameter</li>
    </ul>
    <div class="tab-content">
      <div class="tab-panel active">
        <div class="container">
          <canvas id="stitched_image"></canvas>
          <hr>
          <button id="load">load images</button>
          <input type="file" id="imgs" accept="image/*" multiple>
          <button id="stitch" onclick="stitch()">stitch</button>
          <button id="download" onclick="downloadCanvas()" disabled>download</button>
        </div>
      </div>
      <div class="tab-panel">
        <div class="parameter">
          <crip-slider id="cripTopValue" label="cripTopValue" value="370"></crip-slider>
          <br>
          <crip-slider id="cripBottomValue" label="cripBottomValue" value="230"></crip-slider>
          <br>
          <crip-slider id="cripRightValue" label="cripRightValue" value="200"></crip-slider>
          <br>
          <crip-slider id="cripLeftValue" label="cripLeftValue" value="0"></crip-slider>
          <br>
        </div>
      </div>
    </div>
  </div>
  <script src="./stitch.js"></script>
  <script src="./download.js"></script>
  <script src="./tab.js"></script>
  <script src="./crip_slider.js"></script>
</body>

</html>
